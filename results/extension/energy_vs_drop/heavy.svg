<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
<title id="title">heavy: estimated energy versus drop rate</title>
<desc id="desc">Pareto comparison of five autoscaling strategies. Energy is modelled, not measured.</desc>
