apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-aware-app
  labels:
    app: energy-aware-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: energy-aware-app
  template:
    metadata:
      labels:
        app: energy-aware-app
      annotations:
        # Custom metrics for autoscaling
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: flask-container
          image: flask-k8s-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: FLASK_ENV
              value: "production"